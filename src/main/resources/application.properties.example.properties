# ============================================================
# OURVAULT - EXAMPLE CONFIGURATION
# ============================================================
#
# Copy this file to:
#
# src/main/resources/application.properties
#
# Replace placeholder values with your local configuration.
#
# Never commit passwords, SMTP credentials or JWT secrets.
# ============================================================


# ============================================================
# APPLICATION
# ============================================================

spring.application.name=OurVault


# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/ourvault
spring.datasource.username=YOUR_POSTGRES_USERNAME
spring.datasource.password=YOUR_POSTGRES_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# ============================================================
# FILE UPLOAD
# ============================================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


# ============================================================
# OLLAMA
# ============================================================

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma3:4b
spring.ai.ollama.embedding.options.model=embeddinggemma


# ============================================================
# RAG
# ============================================================

rag.search.minimum-similarity=0.35
rag.search.fallback-minimum-similarity=0.20


# ============================================================
# EMAIL
# ============================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL
spring.mail.password=YOUR_GMAIL_APP_PASSWORD

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ============================================================
# FRONTEND
# ============================================================

ourvault.frontend.base-url=http://localhost:5173


# ============================================================
# PASSWORD RESET
# ============================================================

ourvault.password-reset.expiration-minutes=30


# ============================================================
# JWT
# ============================================================
#
# Add the exact JWT property names used by your JwtService here.
#
# Example:
#
# jwt.secret=YOUR_RANDOM_SECRET
# jwt.access-token-expiration=...
# jwt.refresh-token-expiration=...


# ============================================================
# FILE STORAGE
# ============================================================
#
# Add the exact property used by your FileStorageService,
# if storage location is configurable.
#
# Example:
#
# ourvault.storage.location=uploads