# ============================================================
# OURVAULT - EXAMPLE APPLICATION CONFIGURATION
# ============================================================
#
# Copy this file to:
#
#   src/main/resources/application.properties
#
# Replace placeholder values with your local configuration.
#
# NEVER commit passwords, JWT secrets, SMTP credentials
# or other private configuration.
# ============================================================


# ============================================================
# APPLICATION
# ============================================================

spring.application.name=OurVault


# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/ourvault
spring.datasource.username=YOUR_POSTGRES_USERNAME
spring.datasource.password=YOUR_POSTGRES_PASSWORD

spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# ============================================================
# FILE UPLOAD LIMITS
# ============================================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


# ============================================================
# FILE STORAGE
# ============================================================
#
# Uploaded files are stored relative to this directory.
#
# FileStorageService converts this path to an absolute,
# normalized path at runtime.
#

app.upload-dir=uploads


# ============================================================
# JWT
# ============================================================
#
# jwt.secret:
# Use a long cryptographically random value.
# Keep the real secret only in application.properties.
#
# jwt.expiration:
# Access-token lifetime in milliseconds.
#
# Example below:
# 900000 ms = 15 minutes.
#

jwt.secret=YOUR_LONG_RANDOM_JWT_SECRET
jwt.expiration=900000


# ============================================================
# OLLAMA
# ============================================================

spring.ai.ollama.base-url=http://localhost:11434

spring.ai.ollama.chat.options.model=gemma3:4b

spring.ai.ollama.embedding.options.model=embeddinggemma


# ============================================================
# RAG / SEMANTIC SEARCH
# ============================================================

rag.search.minimum-similarity=0.35
rag.search.fallback-minimum-similarity=0.20


# ============================================================
# SMTP / EMAIL
# ============================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=YOUR_EMAIL_ADDRESS
spring.mail.password=YOUR_GMAIL_APP_PASSWORD

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ============================================================
# FRONTEND
# ============================================================

ourvault.frontend.base-url=http://localhost:5173


# ============================================================
# PASSWORD RESET
# ============================================================

ourvault.password-reset.expiration-minutes=30


# ============================================================
# LOGGING
# ============================================================

logging.level.root=INFO